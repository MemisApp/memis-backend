# Render Blueprint — optional. You can also paste these commands into the
# Render dashboard manually (Settings → Build & Deploy).
services:
  - type: web
    name: memis-api
    runtime: node
    rootDir: .
    autoDeploy: true
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
